{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="d-flex align-items-center mb-3">
  <img src="{% if banca.logo %}{{ banca.logo.url }}{% elif banca.nome_banca == 'Banca do João' %}{% static 'img/seu joao.PNG' %}{% else %}https://via.placeholder.com/120x60?text=Banca{% endif %}" alt="Logo {{ banca.nome_banca }}" class="me-3" style="height:120px; width:auto;">
  <div>
    <h1 class="mb-0">{{ banca.nome_banca }}</h1>
    <p class="text-muted">{{ banca.descricao }}</p>
  </div>
</div>

<h3 class="mt-3">Produtos</h3>
<div class="row">
  {% for produto in produtos %}
    <div class="col-md-3 mb-3">
      <div class="card h-100">
        <img src="{% if produto.foto %}{{ produto.foto.url }}{% elif produto.nome == 'Maçã' %}/media/produtos/maca.png{% else %}https://via.placeholder.com/400x300?text=Produto{% endif %}" class="card-img-top" alt="{{ produto.nome }}">
        <div class="card-body d-flex flex-column">
          <h6 class="card-title">{{ produto.nome }}</h6>
          <p class="mb-3">Preço: R$ {{ produto.preco }}</p>
          <div class="mt-auto">
            <a class="btn btn-outline-primary btn-sm" href="/produto/{{ produto.id }}/">Detalhes</a>
            <form method="post" action="/carrinho/add/{{ produto.id }}/" class="d-inline">
              {% csrf_token %}
              <button class="btn btn-success btn-sm">Adicionar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  {% empty %}
    <p>Nenhum produto nesta banca.</p>
  {% endfor %}
</div>
{% endblock %}

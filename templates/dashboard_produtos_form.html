{% extends 'base.html' %}
{% block content %}
<h1>{% if produto %}Editar Produto{% else %}Novo Produto{% endif %}</h1>
<form method="post" enctype="multipart/form-data">
  {% csrf_token %}
  {% if not produto %}
    <div class="mb-3">
      <label class="form-label">Banca</label>
      <select name="banca_id" class="form-select" required>
        {% for b in bancas %}
          <option value="{{ b.id }}">{{ b.nome_banca }}</option>
        {% endfor %}
      </select>
    </div>
  {% endif %}
  <div class="mb-3">
    <label class="form-label">Nome</label>
    <input name="nome" class="form-control" value="{{ produto.nome|default:'' }}" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Preço</label>
    <input name="preco" type="number" step="0.01" class="form-control" value="{{ produto.preco|default:'' }}" required />
  </div>
  <div class="mb-3">
    <label class="form-label">Foto</label>
    <input name="foto" type="file" class="form-control" {% if not produto %}required{% endif %} />
  </div>
  <div class="mb-3">
    <label class="form-label">Validade</label>
    <input name="validade" type="date" class="form-control" value="{{ produto.validade|date:'Y-m-d' }}" />
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="disponibilidade" id="disp" {% if produto %}{% if produto.disponibilidade %}checked{% endif %}{% else %}checked{% endif %}>
    <label class="form-check-label" for="disp">Disponível</label>
  </div>
  <button class="btn btn-primary" type="submit">Salvar</button>
  <a class="btn btn-secondary" href="/dashboard/produtos/">Cancelar</a>
</form>
{% endblock %}

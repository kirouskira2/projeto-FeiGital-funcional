<!doctype html>
<html lang="pt-br">
{% load static %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FeiGital</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
  <style>
    .brand-text { font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif; font-size: 1.25rem; font-weight: 600; }
    .app-bg { background-image: url("{% static 'img/feirabackgroud.png' %}"); background-size: cover; background-position: center; background-repeat: no-repeat; }
    .content-wrap { background-color: rgba(255,255,255,.72); backdrop-filter: blur(3px); border-radius: .5rem; }
    .card { background-color: #ffffff; }
    h1, h2 { background-color: rgba(212,237,218,.9); display: inline-block; margin: 0 auto; text-align: center; padding: .25rem .5rem; border-radius: .25rem; color: #212529; font-family: 'Poppins', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; letter-spacing: .2px; }
  </style>
</head>
<body class="{% if request.path == '/' %}app-bg{% endif %}">
  <nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
    <div class="container">
      <a class="navbar-brand mx-auto d-flex align-items-center gap-2" href="/" aria-label="FeiGital">
        <img src="{% static 'img/logo-feigital.png.jpg' %}" alt="FeiGital" height="96" width="96" loading="lazy" class="rounded-circle">
        <span class="brand-text">FeiGital</span>
      </a>
      <div class="d-flex">
        <a class="btn btn-outline-primary me-2" href="/carrinho/">Carrinho</a>
        {% if user.is_authenticated %}
          <a class="btn btn-outline-secondary me-2" href="/meus-pedidos/">Meus Pedidos</a>
          <a class="btn btn-outline-info me-2" href="/dashboard/">Dashboard</a>
          <form method="post" action="/accounts/logout/" class="d-inline">
            {% csrf_token %}
            <button class="btn btn-outline-dark">Sair</button>
          </form>
        {% else %}
          <a class="btn btn-outline-success me-2" href="/accounts/login/">Entrar</a>
          <a class="btn btn-primary" href="/accounts/signup/">Cadastrar</a>
        {% endif %}
      </div>
    </div>
  </nav>
  <div class="container {% if request.path == '/' %}content-wrap{% endif %}">
    {% if messages %}
      <div class="mt-2">
        {% for message in messages %}
          <div class="alert alert-info" role="alert">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
